services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ..:/workspace
    environment:
      - PTY_WEB_HOSTNAME=0.0.0.0
      - XDG_DATA_HOME=/workspace/.devcontainer/data
    ports:
      - "3300:3300"
    command: sleep infinity
